---
name: AWS / Security

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the main branch
on: # yamllint disable-line rule:truthy
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "terraform/aws/**"
  pull_request:
    branches:
    - main
    paths:
    - "terraform/aws/**"

permissions:
  contents: read
  security-events: write

jobs:

  aws_access-analyzer:
    name: aws-access-analyzer
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Tfsec
      uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # 0.33.1
      with:
        scan-type: 'config'
        scan-ref: terraform/aws/access-analyzer/modules/access-analyzer
        hide-progress: false
        format: 'sarif'
        output: 'trivy-aws_access-analyzer-1.sarif'
        exit-code: '1'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@0499de31b99561a6d14a36a5f662c2a54f91beee # v4.31.2
      if: always()
      with:
        sarif_file: 'trivy-aws_access-analyzer-1.sarif'
        category: 'aws_access-analyzer-1'

    - name: Tfsec
      uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # 0.33.1
      with:
        scan-type: 'config'
        scan-ref: terraform/aws/access-analyzer/staging
        hide-progress: false
        format: 'sarif'
        output: 'trivy-aws_access-analyzer-2.sarif'
        exit-code: '1'

    - name: Upload Trivy scan results to GitHub Security tab
