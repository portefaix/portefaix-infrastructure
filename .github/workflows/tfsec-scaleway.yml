---
name: Scaleway / Security

on: # yamllint disable-line rule:truthy
  pull_request:
    branches:
    - main
    paths:
    - "terraform/scaleway/**"

permissions:
  contents: read
  security-events: write

jobs:

  scaleway_kapsule:
    name: scaleway-kapsule
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Terraform security scan modules
      uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # 0.33.1
      with:
        scan-type: 'config'
        scan-ref: terraform/scaleway/kapsule/terraform
        hide-progress: false
        format: 'sarif'
        output: 'trivy-scaleway_kapsule-1.sarif'
        exit-code: '1'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@0499de31b99561a6d14a36a5f662c2a54f91beee # v4.31.2
      if: always()
      with:
        sarif_file: 'trivy-scaleway_kapsule-1.sarif'
        category: 'scaleway_kapsule-1'

  scaleway_pips-vpc-gateway:
    name: scaleway-pips-vpc-gateway
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Terraform security scan modules
      uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # 0.33.1
      with:
        scan-type: 'config'
        scan-ref: terraform/scaleway/public-ips/vpc-gateway/terraform
        hide-progress: false
        format: 'sarif'
        output: 'trivy-scaleway_pips-vpc-gateway-1.sarif'
        exit-code: '1'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@0499de31b99561a6d14a36a5f662c2a54f91beee # v4.31.2
      if: always()
      with:
        sarif_file: 'trivy-scaleway_pips-vpc-gateway-1.sarif'
        category: 'scaleway_pips-vpc-gateway-1'

  scaleway_vpc:
    name: scaleway-vpc
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Terraform security scan modules
      uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # 0.33.1
      with:
        scan-type: 'config'
        scan-ref: terraform/scaleway/vpc/terraform
        hide-progress: false
        format: 'sarif'
        output: 'trivy-scaleway_vpc-1.sarif'
        exit-code: '1'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@0499de31b99561a6d14a36a5f662c2a54f91beee # v4.31.2
      if: always()
      with:
        sarif_file: 'trivy-scaleway_vpc-1.sarif'
        category: 'scaleway_vpc-1'
