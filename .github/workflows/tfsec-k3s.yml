---
name: K3s / Security

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the main branch
on: # yamllint disable-line rule:truthy
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "terraform/k3s/**"
  pull_request:
    branches:
    - main
    paths:
    - "terraform/k3s/**"

permissions:
  contents: read
  security-events: write

jobs:

  k3s_dns:
    name: k3s-dns
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Terraform security scan modules
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'config'
        scan-ref: terraform/k3s/dns/terraform
        hide-progress: false
        format: 'sarif'
        output: 'trivy-k3s_dns-1.sarif'
        exit-code: '1'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@0499de31b99561a6d14a36a5f662c2a54f91beee # v4.31.2
      if: always()
      with:
        sarif_file: 'trivy-k3s_dns-1.sarif'
        category: 'k3s_dns-1'

  k3s_observability:
    name: k3s-observability
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Terraform security scan modules
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        scan-type: 'config'
        scan-ref: terraform/k3s/observability/terraform
        hide-progress: false
        format: 'sarif'
        output: 'trivy-k3s_observability-1.sarif'
        exit-code: '1'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@0499de31b99561a6d14a36a5f662c2a54f91beee # v4.31.2
      if: always()
      with:
        sarif_file: 'trivy-k3s_observability-1.sarif'
        category: 'k3s_observability-1'
