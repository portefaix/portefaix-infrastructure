---
name: IBMCloud / Security

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the main branch
on: # yamllint disable-line rule:truthy
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "terraform/ibmcloud/**"
  pull_request:
    branches:
    - main
    paths:
    - "terraform/ibmcloud/**"

permissions:
  contents: read
  security-events: write

jobs:

  ibmcloud_iks:
    name: ibmcloud-iks
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Terraform security scan modules
      uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # 0.33.1
      with:
        scan-type: 'config'
        scan-ref: terraform/ibmcloud/iks/terraform
        hide-progress: false
        format: 'sarif'
        output: 'trivy-ibmcloud_iks-1.sarif'
        exit-code: '1'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      if: always()
      with:
        sarif_file: 'trivy-ibmcloud_iks-1.sarif'
        category: 'ibmcloud_iks-1'

  ibmcloud_vpc:
    name: ibmcloud-vpc
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Terraform security scan modules
      uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # 0.33.1
      with:
        scan-type: 'config'
        scan-ref: terraform/ibmcloud/vpc/terraform
        hide-progress: false
        format: 'sarif'
        output: 'trivy-ibmcloud_vpc-1.sarif'
        exit-code: '1'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      if: always()
      with:
        sarif_file: 'trivy-ibmcloud_vpc-1.sarif'
        category: 'ibmcloud_vpc-1'
